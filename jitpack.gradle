// Gradle init script used only by jitpack.yml. It publishes the engine (the root project of kotlin/)
// to the local Maven repository without touching the upstream build files. On JitPack the
// coordinates become GROUP:ARTIFACT:VERSION, e.g. com.github.<user>:slackwater:<commit>.
rootProject {
    apply plugin: 'maven-publish'
    plugins.withId('org.jetbrains.kotlin.jvm') {
        java { withSourcesJar() }
        publishing {
            publications {
                engine(MavenPublication) {
                    from components.java
                    pom {
                        name = 'Slackwater engine'
                        description = 'Offline tide and current prediction engine for Kotlin/JVM'
                        url = 'https://github.com/openwatersio/slackwater'
                        licenses {
                            license {
                                name = 'MIT'
                                url = 'https://opensource.org/licenses/MIT'
                            }
                        }
                    }
                }
            }
        }
    }
    afterEvaluate {
        if (System.getenv('JITPACK')) {
            publishing.publications.engine.groupId = System.getenv('GROUP')
            publishing.publications.engine.artifactId = System.getenv('ARTIFACT')
            publishing.publications.engine.version = System.getenv('VERSION')
        }
    }
}
