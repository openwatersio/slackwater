name: Build CLI Binaries

on:
  workflow_dispatch: # Allow manual triggering (uses latest @slackwater/cli release)
  push:
  release:
    types: [published]

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [[ "$TAG" == @slackwater/cli@* ]]; then
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(gh api repos/${{ github.repository }}/releases --jq '[.[] | select(.tag_name | startswith("@slackwater/cli@"))][0].tag_name')
            if [ -n "$TAG" ]; then
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-latest
          - target: win-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # SEA binary build uses `node --build-sea` (needs Node 25.5+).
          # On 26 (Current, LTS-track) rather than 25, which is now EOL.
          node-version: "26"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Build SEA binary
        run: npm run build:sea --workspace=packages/cli

      - name: Verify reproducible build
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            SHASUM="sha256sum"
          else
            SHASUM="shasum -a 256"
          fi
          EXT=${{ matrix.target == 'win-x64' && '".exe"' || '""' }}
          BIN="packages/cli/dist/slackwater${EXT}"
          HASH1=$($SHASUM "$BIN" | cut -d' ' -f1)
          npm run build:sea --workspace=packages/cli
          HASH2=$($SHASUM "$BIN" | cut -d' ' -f1)
          if [ "$HASH1" != "$HASH2" ]; then
            echo "::error::Build not reproducible! $HASH1 vs $HASH2"
            exit 1
          fi
          echo "Build is reproducible: $HASH1"

      - name: Smoke test SEA binary
        run: npm run smoke:sea --workspace=packages/cli

      - name: Package binary (Unix)
        if: matrix.target != 'win-x64'
        run: tar czf packages/cli/slackwater-${{ matrix.target }}.tar.gz -C packages/cli/dist slackwater LICENSE NOTICE

      - name: Package binary (Windows)
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path packages/cli/dist/slackwater.exe, packages/cli/dist/LICENSE, packages/cli/dist/NOTICE -DestinationPath packages/cli/slackwater-${{ matrix.target }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: slackwater-${{ matrix.target }}
          path: packages/cli/slackwater-${{ matrix.target }}.*

  checksums:
    if: needs.resolve-tag.outputs.should_release == 'true'
    name: Upload release assets
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    # The only job with a write token; it runs no checkout, install, or build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums file
        run: |
          cd artifacts
          sha256sum */slackwater-* | sed 's|[^ ]*/||' > ../checksums.txt
          cat ../checksums.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: checksums.txt

      - name: Upload binaries and checksums to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: |
            artifacts/*/slackwater-*
            checksums.txt

  update-homebrew:
    if: needs.resolve-tag.outputs.should_release == 'true'
    name: Update Homebrew tap
    needs: [resolve-tag, build, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download checksums artifact
        uses: actions/download-artifact@v8
        with:
          name: checksums

      - name: Generate formula
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG##*@}"
          SHA_DARWIN_ARM64=$(grep slackwater-darwin-arm64.tar.gz checksums.txt | cut -d' ' -f1)
          SHA_LINUX_X64=$(grep slackwater-linux-x64.tar.gz checksums.txt | cut -d' ' -f1)

          sed \
            -e "s|{{TAG}}|${TAG}|g" \
            -e "s|{{VERSION}}|${VERSION}|g" \
            -e "s|{{REPO}}|${REPO}|g" \
            -e "s|{{SHA256_DARWIN_ARM64}}|${SHA_DARWIN_ARM64}|g" \
            -e "s|{{SHA256_LINUX_X64}}|${SHA_LINUX_X64}|g" \
            packages/cli/homebrew/slackwater.rb > slackwater.rb

      - name: Push to Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/openwatersio/homebrew-tap.git" tap
          # The tap adds Formula/slackwater.rb itself; releases only update it once it exists
          if [ ! -f tap/Formula/slackwater.rb ]; then
            echo "::notice::Formula/slackwater.rb is not in the tap yet; skipping the Homebrew update for ${TAG}"
            exit 0
          fi
          cp slackwater.rb tap/Formula/slackwater.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/slackwater.rb
          git commit -m "Update slackwater to ${TAG}"
          git push
