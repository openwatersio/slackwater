name: Swift release

on:
  push:
    tags:
      - "v*"

jobs:
  smoke-swiftpm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: swift
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          version: "2026.9.11"
          install_args: swift
          cache_key_prefix: mise-swift-v1

      - name: Resolve and run this tag from SwiftPM
        run: |
          mise --version
          mise which swift
          mise exec swift -- swift --version
          version="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/slackwater-smoke/Sources/slackwater-smoke
          cat > /tmp/slackwater-smoke/Package.swift <<EOF
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "slackwater-smoke",
              dependencies: [
                  .package(url: "https://github.com/openwatersio/slackwater.git", exact: "${version}")
              ],
              targets: [
                  .executableTarget(
                      name: "slackwater-smoke",
                      dependencies: [
                          .product(name: "SlackwaterKit", package: "slackwater"),
                          .product(name: "SlackwaterIWLS", package: "slackwater"),
                      ]
                  )
              ]
          )
          EOF
          cat > /tmp/slackwater-smoke/Sources/slackwater-smoke/main.swift <<'EOF'
          import Foundation
          import SlackwaterIWLS
          import SlackwaterKit

          let station = Station(constituents: [
              HarmonicConstituent(name: "M2", amplitude: 1, phase: 0)
          ])
          print(station.heights(from: Date(), to: Date().addingTimeInterval(600)).count)
          // No request: building a plan is enough to prove the product resolves from a tag.
          print(IwlsFetch.chunkPlan(days: 60, end: Date()).count)
          EOF
          mise exec swift -- swift run --package-path /tmp/slackwater-smoke
