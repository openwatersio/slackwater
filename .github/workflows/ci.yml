name: CI
on:
  push:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      swift: ${{ steps.filter.outputs.swift }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      homebrew: ${{ steps.filter.outputs.homebrew }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo 'typescript=true' >> "$GITHUB_OUTPUT"
            echo 'swift=true' >> "$GITHUB_OUTPUT"
            echo 'fixtures=true' >> "$GITHUB_OUTPUT"
            echo 'homebrew=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only origin/main...HEAD)
          echo "$changed"
          if [ -z "$changed" ]; then
            echo 'typescript=false' >> "$GITHUB_OUTPUT"
            echo 'swift=false' >> "$GITHUB_OUTPUT"
            echo 'fixtures=false' >> "$GITHUB_OUTPUT"
            echo 'homebrew=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qEv '^(swift/|Package\.swift$)'; then
            echo 'typescript=true' >> "$GITHUB_OUTPUT"
          else
            echo 'typescript=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(swift/|fixtures/|packages/engine/|Package\.swift$|\.github/workflows/)'; then
            echo 'swift=true' >> "$GITHUB_OUTPUT"
          else
            echo 'swift=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(fixtures/|packages/engine/|swift/Sources/SlackwaterKit/Resources/|package\.json$|tsconfig\.json$|tsdown\.config\.js$|\.github/workflows/)'; then
            echo 'fixtures=true' >> "$GITHUB_OUTPUT"
          else
            echo 'fixtures=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(packages/cli/homebrew/|\.github/workflows/)'; then
            echo 'homebrew=true' >> "$GITHUB_OUTPUT"
          else
            echo 'homebrew=false' >> "$GITHUB_OUTPUT"
          fi

  homebrew:
    # brew tap loads every formula for every OS and CPU, and one that fails to load breaks
    # the whole tap, so check the release template before a release renders and pushes it
    needs: changes
    if: needs.changes.outputs.homebrew == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render formula
        run: |
          sed \
            -e "s|{{TAG}}|@slackwater/cli@1.0.0-beta.1|g" \
            -e "s|{{VERSION}}|1.0.0-beta.1|g" \
            -e "s|{{REPO}}|${GITHUB_REPOSITORY}|g" \
            -e "s|{{SHA256_DARWIN_ARM64}}|$(printf '0%.0s' {1..64})|g" \
            -e "s|{{SHA256_LINUX_X64}}|$(printf '1%.0s' {1..64})|g" \
            packages/cli/homebrew/slackwater.rb > slackwater.rb
          if grep -n '{{' slackwater.rb; then exit 1; fi

      - name: Check formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew update --quiet
          tap="$(brew --repository)/Library/Taps/openwatersio/homebrew-check"
          mkdir -p "$tap/Formula"
          cp slackwater.rb "$tap/Formula/slackwater.rb"
          git -C "$tap" init --quiet
          # readall skips an untrusted tap with a warning and exits 0, so without this the check passes vacuously
          brew trust openwatersio/check
          brew style "$tap/Formula/slackwater.rb"
          brew readall --os=all --arch=all openwatersio/check

  changeset:
    needs: changes
    if: github.ref != 'refs/heads/main' && needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install modules
        run: npm install

      - name: Fetch base branch
        run: git fetch origin main --depth=1

  lint:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install modules
        run: npm install

      - name: Lint code
        run: npm run lint

  test:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install modules
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      # Do not run npm build here! This intentonally runs tests against the unbuilt source
      # to ensure that the tests are properly configured to run against the source files.

      - name: Test
        run: npm run coverage

      - name: Report coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          fail_ci_if_error: true
          files: ./coverage/coverage-final.json

  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Test Swift
        run: swift test -c release

      - name: Compile for watchOS
        if: runner.os == 'macOS'
        run: swift build --scratch-path .build-watch --triple arm64_32-apple-watchos9.0 --sdk "$(xcrun --sdk watchos --show-sdk-path)"

  fixtures:
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install modules
        run: npm install

      - name: Check fixtures
        run: npm run fixtures:check

  publish:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install modules
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to pkg.pr.new
        run: npx pkg-pr-new publish ./packages/*

  benchmarks:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    uses: ./.github/workflows/benchmarks.yml

  examples:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install modules
        run: npm install

      - name: Build
        run: npm run build

      - name: Run examples
        run: for e in examples/*.ts; do node "$e"; done
