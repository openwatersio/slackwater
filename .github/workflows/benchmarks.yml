name: Benchmarks
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Re-run against fresh NOAA/CHS predictions monthly, even without pushes.
    - cron: "23 6 2 * *"

jobs:
  benchmarks:
    runs-on: ubuntu-26.04
    concurrency:
      group: benchmarks-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    env:
      FAST: ${{ github.ref != 'refs/heads/main' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml

      - name: Install modules
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compute cache month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache benchmark data
        id: benchmark-cache
        uses: actions/cache@v6
        with:
          path: .test-cache
          # Month-stamped so cached reference predictions roll over and the
          # scheduled run compares against fresh data. Test files don't fetch,
          # so editing one keeps the cache.
          key: benchmarks-${{ env.FAST }}-${{ steps.month.outputs.month }}-${{ hashFiles('benchmarks/*.ts', '!benchmarks/*.test.ts') }}

      - name: Run benchmarks
        run: npm run benchmarks

      # Branch pushes run the quick CHS current benchmark as a regression check.
      # The monthly schedule and manual dispatch on main run it in full on the
      # newest grid point, and the upload below keeps its rows for 90 days.
      # Pushes to main skip it. Every run sets NO_FLOORS, because the share and
      # p50 floors were set under scorer version 1 (#437); the reversed-axis
      # check still runs. openwatersio/chs-current-validation will take over the
      # full run and pool a year of rows per gate.
      - name: Run CHS current fit benchmark
        if: ${{ !cancelled() && (env.FAST != '' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          NO_FLOORS: "1"
        run: npm run chs-current-fit

      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: |
            benchmarks/*.csv
            benchmarks/*.jsonl
